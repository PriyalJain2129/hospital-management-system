# ==========================================
# 1. DATASOURCE CONFIGURATION (TiDB Cloud)
# ==========================================
spring.datasource.url=jdbc:mysql://gateway01.ap-southeast-1.prod.alicloud.tidbcloud.com:4000/hospital_management?sslMode=PREFERRED&allowPublicKeyRetrieval=true
spring.datasource.username=zrXG1qkCELCEppU.root
spring.datasource.password=1G86zzKVjWwqujI4
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# 2. HIKARI CONNECTION POOL OPTIMIZATION
# ==========================================
# Optimizes connections to the Singapore cloud region to prevent timeout hangs
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=250
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048

# ==========================================
# 3. JPA / HIBERNATE CONFIGURATION
# ==========================================
spring.jpa.show-sql=true

# NOTE: Automatically detects the Dialect (fixes HHH90000025 warning)
# 'update' is fine for development, change to 'validate' for production
spring.jpa.hibernate.ddl-auto=update

# Prevents connection pool starvation (fixes the OSIV warning)
spring.jpa.open-in-view=false

# ==========================================
# 4. SECURITY CONFIGURATION
# ==========================================
# Mutes the auto-generated password warning using your default credentials
spring.security.user.name=admin
spring.security.user.password=1234

# ==========================================
# 5. SERVER CONFIGURATION
# ==========================================
server.port=8080